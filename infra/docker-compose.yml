services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicrew
      POSTGRES_PASSWORD: aicrew
      POSTGRES_DB: aicrew
    volumes:
      - aicrew-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://aicrew:aicrew@postgres:5432/aicrew
      SERVER_PORT: 8080
    volumes:
      # agents/*.md를 바인드 마운트 - 직원 정의를 추가/수정해도 이미지 재빌드가 필요 없다.
      - ../agents:/repo/agents:ro
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - aicrew-caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
      - web

volumes:
  aicrew-postgres:
  aicrew-caddy-data:
